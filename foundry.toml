[profile.default]
src = "contracts/src"
test = "contracts/test"
out = "contracts/out"
cache_path = "contracts/cache"
libs = ["vendor"]
solc_version = "0.8.38"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
bytecode_hash = "none"
remappings = ["forge-std/=vendor/forge-std/src/"]

[fuzz]
runs = 256
